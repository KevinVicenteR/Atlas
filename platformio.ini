[platformio]
default_envs = atlas

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_flags = -Wall -Wextra -std=gnu++14
build_unflags = -std=gnu++11
lib_ldf_mode = chain+

[env:atlas]
upload_protocol = usbasp
upload_flags = -e

[env:atlas_uart]
upload_protocol = arduino
monitor_speed = 115200
